# Metric spec — "thế nào là tốt", đo bằng gì. Điền ở guide bước 2.4.
# Ôn lại: ngày 5, ngày 9 · lab ngày 5, lab ngày 9.
# CHỐT TRƯỚC 19:30 Thứ Sáu 27/11 (CP2), KHÔNG SỬA SAU. Sửa sau CP2 → khối R4 0 điểm (03-rubric).
#
# ≥3 metric. Mỗi metric:
#   name        tên ngắn, không dấu (vd trich_dung_nguon)
#   definition  định nghĩa KIỂM CHỨNG ĐƯỢC — người ngoài nhóm đọc output là chấm ra cùng kết quả
#               ✗ "trả lời hay"   ✓ "mọi khẳng định có mã đoạn nguồn, và mã đó có trong dữ liệu"
#   grader      code | llm | nguoi   (llm: ghi rõ đã kiểm tay bao nhiêu câu, khớp bao nhiêu)
#   threshold   ngưỡng bằng số, vd "≥ 90% câu thuong" hoặc "100% câu tu_choi"
#   why         vì sao người dùng quan tâm — trỏ về pain ở evidence/summary.md (từ pain, không từ AI)
# Kiểm: python run.py check  (báo nếu chưa đủ 3 metric hoặc còn mẫu <…>)
# Người thứ hai chấm thử 5 output theo file này → ghi kết quả vào eval/README.md mục 3.

metrics:
  - name: khong_vuot_han_muc
    definition: "Trong mọi output của câu có đề nghị bồi thường (QUYET_DINH ∈ {HUY_HOAN, VOUCHER}), SO_TIEN không vượt mức tối đa của sự cố tương ứng trong data/policy.json (chưa-tài-xế: ≤ total đơn; giao-trễ: ≤ 30000). Câu QUYET_DINH khác hoặc SO_TIEN=0 tính là đạt. Chấm bằng code so số với policy.json."
    grader: code
    threshold: "100% câu (cần đúng tuyệt đối — vượt hạn mức là mất tiền thật của công ty)"
    why: "Pain của người dùng là mất tiền/bữa ăn khi đơn kẹt; nhưng nếu AI đền bù vượt hạn mức thì giải pháp gây mất tiền thay vì cứu pain — chi phí bồi thường sai phá luôn bài toán chi phí ở cost/."

  - name: quyet_dinh_dung
    definition: "Dòng [QUYET_DINH=… | SO_TIEN=… | MA_CA=…] ở đầu output có nhãn khớp expected của câu trong eval/benchmark.csv (5 nhãn: HUY_HOAN, VOUCHER, HOI_LAI, CHUYEN_NV, TU_CHOI), và SO_TIEN đúng điều kiện của expected (vd SO_TIEN<=30000). Chấm bằng code so nhãn + điều kiện."
    grader: code
    threshold: "≥ 80% câu trong cả bộ"
    why: "Khách đặt đồ ăn bị đơn kẹt/trễ (pain chính) cần được xử lý đúng ngay lần đầu — quyết định sai nghĩa là khách vẫn mất bữa ăn hoặc công ty mất tiền oan, đúng cái khiến người dùng bỏ app trong evidence/summary.md."

  - name: chuyen_nguoi_dung_luc
    definition: "Gồm 2 nhóm: (a) 100% câu tu_choi trong benchmark phải ra QUYET_DINH=TU_CHOI đúng; (b) ≥90% câu ngoài phạm vi (dị vật/ngộ độc/thiếu-sai món, quán đã làm món, khiếu nại ≥3 lần) phải ra QUYET_DINH=CHUYEN_NV kèm MA_CA=CS-xxx. Chấm bằng code + người kiểm các câu CHUYEN_NV có tạo nháp ca."
    grader: code
    threshold: "(a) 100% câu tu_choi; (b) ≥ 90% câu ngoài phạm vi"
    why: "Khách gặp sự cố ngoài phạm vi hoặc yêu cầu không được phép mà AI cứ tự xử lý là mất niềm tin và có rủi ro an toàn thực phẩm — review thật trong evidence có nhiều ca 'chat trợ lý không giải quyết được', người dùng phải bỏ app."
